<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="description" content="Norman, a geometric color palette for Noctalia." />
    <title>Norman — Noctalia color palette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #0d0d0d;
        --foreground: #f2f2f2;
        --primary: #33cc99;
        --secondary: #f0db75;
        --tertiary: #f0758a;
        --hover: #adebd6;
        --body-font: "DM Sans", sans-serif;
        --heading-font: "Playfair Display", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--body-font);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        position: relative;
        display: grid;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 320px;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
      }

      .palette {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: clamp(22px, 5vh, 42px);
        padding: 32px 20px;
      }

      h1 {
        margin: 0;
        color: var(--foreground);
        font-family: var(--heading-font);
        font-size: clamp(3.4rem, 9vw, 6rem);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 1;
      }

      h1 span {
        color: var(--primary);
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(5, clamp(42px, 7.2vw, 76px));
        gap: clamp(10px, 2vw, 18px);
      }

      .swatch {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        padding: 0;
        border: 1px solid rgb(242 242 242 / 16%);
        border-radius: clamp(10px, 1.5vw, 18px);
        background: var(--swatch);
        box-shadow: 0 7px 22px rgb(0 0 0 / 18%);
        cursor: copy;
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .swatch:hover,
      .swatch:focus-visible {
        z-index: 3;
        transform: translateY(-3px) scale(1.04);
        border-color: var(--foreground);
        box-shadow: 0 10px 28px rgb(0 0 0 / 34%);
        outline: none;
      }

      .swatch::after {
        position: absolute;
        z-index: 5;
        top: calc(100% + 10px);
        left: 50%;
        width: max-content;
        max-width: min(220px, 86vw);
        padding: 9px 11px;
        transform: translate(-50%, -4px);
        border: 1px solid rgb(128 128 128 / 30%);
        border-radius: 8px;
        background: #1a1a1a;
        color: var(--foreground);
        content: attr(data-tooltip);
        font: 500 0.72rem/1.55 var(--body-font);
        opacity: 0;
        pointer-events: none;
        text-align: center;
        white-space: pre-line;
        transition: opacity 120ms ease, transform 120ms ease;
      }

      .swatch:nth-child(n + 6)::after {
        top: auto;
        bottom: calc(100% + 10px);
        transform: translate(-50%, 4px);
      }

      .swatch:hover::after,
      .swatch:focus-visible::after {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      .quote {
        position: absolute;
        z-index: 1;
        top: clamp(22px, 5vh, 48px);
        right: clamp(22px, 5vw, 72px);
        width: min(300px, 42vw);
        margin: 0;
        color: var(--hover);
        font-family: var(--heading-font);
        font-size: clamp(1rem, 2vw, 1.4rem);
        font-weight: 500;
        line-height: 1.45;
        text-align: right;
      }

      .portrait {
        position: absolute;
        z-index: 0;
        right: max(-2rem, calc((100vw - 1440px) / 2));
        bottom: 0;
        width: min(42vw, 560px);
        max-height: 72svh;
        object-fit: contain;
        object-position: bottom right;
        opacity: 0.24;
        filter: brightness(0) saturate(100%) invert(76%) sepia(35%) saturate(575%)
          hue-rotate(104deg) brightness(96%) contrast(90%);
        pointer-events: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        .palette {
          gap: clamp(20px, 5vh, 32px);
          padding-inline: 12px;
        }

        .swatches {
          grid-template-columns: repeat(5, clamp(40px, 12vw, 58px));
          gap: clamp(8px, 2.7vw, 12px);
        }

        .quote {
          top: 20px;
          right: 20px;
          width: min(220px, 58vw);
          font-size: clamp(0.88rem, 4vw, 1.1rem);
        }

        .portrait {
          right: -4rem;
          width: min(78vw, 420px);
          max-height: 58svh;
          opacity: 0.18;
        }
      }

      @media (max-height: 500px) {
        .palette {
          gap: 16px;
          padding-block: 16px;
        }

        h1 {
          font-size: clamp(2.8rem, 12vh, 4rem);
        }

        .swatches {
          grid-template-columns: repeat(5, clamp(36px, 7vh, 58px));
          gap: 9px;
        }

        .portrait {
          max-height: 58svh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <blockquote class="quote">“I'm something of a designer myself.”</blockquote>
      <img class="portrait" src="norman_silhouette.png" alt="" aria-hidden="true" />

      <section class="palette" aria-labelledby="title">
        <h1 id="title">Nor<span>man</span></h1>
        <div class="swatches" aria-label="Norman color palette">
          <button class="swatch" style="--swatch:#0D0D0D" data-name="Surface" data-hex="#0D0D0D" data-hsl="hsl(0 0% 5%)" data-tooltip="Surface · #0D0D0D&#10;hsl(0 0% 5%)" aria-label="Copy Surface, #0D0D0D, hsl(0 0% 5%)"></button>
          <button class="swatch" style="--swatch:#F2F2F2" data-name="On surface" data-hex="#F2F2F2" data-hsl="hsl(0 0% 95%)" data-tooltip="On surface · #F2F2F2&#10;hsl(0 0% 95%)" aria-label="Copy On surface, #F2F2F2, hsl(0 0% 95%)"></button>
          <button class="swatch" style="--swatch:#333333" data-name="Surface variant" data-hex="#333333" data-hsl="hsl(0 0% 20%)" data-tooltip="Surface variant · #333333&#10;hsl(0 0% 20%)" aria-label="Copy Surface variant, #333333, hsl(0 0% 20%)"></button>
          <button class="swatch" style="--swatch:#808080" data-name="Outline" data-hex="#808080" data-hsl="hsl(0 0% 50%)" data-tooltip="Outline · #808080&#10;hsl(0 0% 50%)" aria-label="Copy Outline, #808080, hsl(0 0% 50%)"></button>
          <button class="swatch" style="--swatch:#4D4D4D" data-name="Shadow" data-hex="#4D4D4D" data-hsl="hsl(0 0% 30%)" data-tooltip="Shadow · #4D4D4D&#10;hsl(0 0% 30%)" aria-label="Copy Shadow, #4D4D4D, hsl(0 0% 30%)"></button>
          <button class="swatch" style="--swatch:#33CC99" data-name="Primary" data-hex="#33CC99" data-hsl="hsl(160 60% 50%)" data-tooltip="Primary · #33CC99&#10;hsl(160 60% 50%)" aria-label="Copy Primary, #33CC99, hsl(160 60% 50%)"></button>
          <button class="swatch" style="--swatch:#F0DB75" data-name="Secondary" data-hex="#F0DB75" data-hsl="hsl(50 80% 70%)" data-tooltip="Secondary · #F0DB75&#10;hsl(50 80% 70%)" aria-label="Copy Secondary, #F0DB75, hsl(50 80% 70%)"></button>
          <button class="swatch" style="--swatch:#F0758A" data-name="Tertiary" data-hex="#F0758A" data-hsl="hsl(350 80% 70%)" data-tooltip="Tertiary · #F0758A&#10;hsl(350 80% 70%)" aria-label="Copy Tertiary, #F0758A, hsl(350 80% 70%)"></button>
          <button class="swatch" style="--swatch:#ADEBD6" data-name="Hover" data-hex="#ADEBD6" data-hsl="hsl(160 61% 80%)" data-tooltip="Hover · #ADEBD6&#10;hsl(160 61% 80%)" aria-label="Copy Hover, #ADEBD6, hsl(160 61% 80%)"></button>
          <button class="swatch" style="--swatch:#F07575" data-name="Error" data-hex="#F07575" data-hsl="hsl(0 80% 70%)" data-tooltip="Error · #F07575&#10;hsl(0 80% 70%)" aria-label="Copy Error, #F07575, hsl(0 80% 70%)"></button>
        </div>
      </section>
      <span class="sr-only" id="copy-status" aria-live="polite"></span>
    </main>
    <script>
      const status = document.querySelector("#copy-status");

      async function copyHex(button) {
        const hex = button.dataset.hex;
        try {
          await navigator.clipboard.writeText(hex);
        } catch {
          const input = document.createElement("textarea");
          input.value = hex;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.append(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }

        const tooltip = button.dataset.tooltip;
        button.dataset.tooltip = `Copied ${hex}`;
        status.textContent = `Copied ${hex} to clipboard`;
        window.setTimeout(() => {
          button.dataset.tooltip = tooltip;
        }, 1200);
      }

      document.querySelectorAll(".swatch").forEach((button) => {
        button.addEventListener("click", () => copyHex(button));
      });
    </script>
  </body>
</html>
